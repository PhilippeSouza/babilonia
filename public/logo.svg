<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282a36"/>
      <stop offset="100%" stop-color="#191a21"/>
    </linearGradient>
    <linearGradient id="chairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd93f9"/>
      <stop offset="100%" stop-color="#ff79c6"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcc99"/>
      <stop offset="100%" stop-color="#ffb86c"/>
    </linearGradient>
  </defs>

  <!-- Fundo Arredondado Dracula -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" stroke="#bd93f9" stroke-width="4"/>

  <!-- Encosto da Cadeira Gamer (Atrás) -->
  <path d="M34 26 L50 14 L78 14 L94 26 L88 86 L40 86 Z" fill="#313442" stroke="url(#chairGrad)" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Detalhes / Faixas Neon da Cadeira Gamer -->
  <path d="M46 22 L42 78 M82 22 L86 78" stroke="#ff79c6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Almofada de Pescoço Gamer -->
  <rect x="51" y="22" width="26" height="9" rx="4.5" fill="#bd93f9"/>

  <!-- Braços da Cadeira Gamer -->
  <path d="M26 68 L38 68 L38 88" fill="none" stroke="#8be9fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M102 68 L90 68 L90 88" fill="none" stroke="#8be9fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Assento da Cadeira Gamer -->
  <rect x="30" y="84" width="68" height="12" rx="6" fill="url(#chairGrad)" stroke="#f8f8f2" stroke-width="2"/>

  <!-- Base e Rodinhas da Cadeira Gamer -->
  <line x1="64" y1="96" x2="64" y2="110" stroke="#6272a4" stroke-width="5"/>
  <path d="M42 114 L64 108 L86 114" fill="none" stroke="#8be9fd" stroke-width="4" stroke-linecap="round"/>
  <circle cx="42" cy="117" r="4" fill="#ff79c6"/>
  <circle cx="64" cy="117" r="4" fill="#ff79c6"/>
  <circle cx="86" cy="117" r="4" fill="#ff79c6"/>

  <!-- Personagem em pé em cima do assento da cadeira gamer -->
  <!-- Pés apoiados no assento -->
  <ellipse cx="52" cy="84" rx="7" ry="4" fill="#f8f8f2"/>
  <ellipse cx="76" cy="84" rx="7" ry="4" fill="#f8f8f2"/>

  <!-- Pernas -->
  <rect x="47" y="62" width="10" height="21" rx="4" fill="url(#skinGrad)"/>
  <rect x="71" y="62" width="10" height="21" rx="4" fill="url(#skinGrad)"/>

  <!-- Calças Abaixadas nos Tornozelos/Canelas! -->
  <path d="M43 72 Q64 76 85 72 L87 81 Q64 85 41 81 Z" fill="#6272a4" stroke="#8be9fd" stroke-width="2"/>
  <line x1="56" y1="74" x2="72" y2="74" stroke="#f1fa8c" stroke-width="2" stroke-linecap="round"/>

  <!-- Tronco / Camisa levantada (inclinado mostrando a bunda) -->
  <path d="M44 34 Q64 28 84 34 L82 52 Q64 48 46 52 Z" fill="#50fa7b" stroke="#282a36" stroke-width="2"/>

  <!-- Cabeça virada olhando por cima do ombro com Headset Gamer -->
  <circle cx="64" cy="22" r="10" fill="url(#skinGrad)" stroke="#282a36" stroke-width="2"/>
  <!-- Headset Gamer -->
  <path d="M53 22 A11 11 0 0 1 75 22" fill="none" stroke="#ff5555" stroke-width="3.5"/>
  <rect x="50" y="18" width="5" height="9" rx="2.5" fill="#ff79c6"/>
  <rect x="73" y="18" width="5" height="9" rx="2.5" fill="#ff79c6"/>

  <!-- A BUNDA (Destaque Cartoon Cômico no Centro!) -->
  <circle cx="55" cy="56" r="13" fill="url(#skinGrad)" stroke="#282a36" stroke-width="2.5"/>
  <circle cx="73" cy="56" r="13" fill="url(#skinGrad)" stroke="#282a36" stroke-width="2.5"/>
  <!-- Curva central da bunda -->
  <path d="M64 45 Q66 56 64 67" fill="none" stroke="#282a36" stroke-width="3" stroke-linecap="round"/>
  <!-- Brilho Cômico / Estrelinha Neon -->
  <path d="M95 44 L99 48 L104 44 L100 50 L104 55 L98 52 L94 56 L96 50 Z" fill="#f1fa8c"/>
</svg>
