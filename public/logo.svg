<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#2a2438"/>
      <stop offset="65%" stop-color="#191a24"/>
      <stop offset="100%" stop-color="#0f1016"/>
    </radialGradient>
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd93f9"/>
      <stop offset="50%" stop-color="#ff79c6"/>
      <stop offset="100%" stop-color="#8be9fd"/>
    </linearGradient>
    <linearGradient id="chairLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2e3e"/>
      <stop offset="100%" stop-color="#171821"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffe4d1"/>
      <stop offset="55%" stop-color="#f2bfa0"/>
      <stop offset="100%" stop-color="#c9886b"/>
    </linearGradient>
    <linearGradient id="denimTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b5378"/>
      <stop offset="60%" stop-color="#25354f"/>
      <stop offset="100%" stop-color="#162033"/>
    </linearGradient>
    <linearGradient id="hoodieTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c345c"/>
      <stop offset="100%" stop-color="#1f1b33"/>
    </linearGradient>
    <filter id="inkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Escudo / Moldura Hexagonal Arredondada com Borda Dupla Traçada -->
  <rect x="14" y="14" width="484" height="484" rx="108" fill="url(#bgGlow)" stroke="url(#neonRim)" stroke-width="8"/>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#6272a4" stroke-width="1.8" stroke-dasharray="14 6 4 6" opacity="0.65"/>

  <!-- Linhas de Fundo Estilo Sketch / Hachura Radial -->
  <g stroke="#bd93f9" stroke-width="1.2" opacity="0.18" stroke-linecap="round">
    <line x1="65" y1="110" x2="130" y2="145"/>
    <line x1="55" y1="130" x2="115" y2="160"/>
    <line x1="440" y1="100" x2="375" y2="140"/>
    <line x1="455" y1="125" x2="390" y2="158"/>
    <line x1="58" y1="360" x2="125" y2="335"/>
    <line x1="448" y1="350" x2="380" y2="325"/>
    <circle cx="256" cy="256" r="195" fill="none" stroke-dasharray="4 10"/>
    <circle cx="256" cy="256" r="165" fill="none" stroke="#8be9fd" stroke-dasharray="20 8 2 8"/>
  </g>

  <g filter="url(#inkShadow)">
    <!-- ============================================================== -->
    <!-- 1. CADEIRA GAMER PRO (DETALHADA COM COSTURAS E HACHURAS INK)   -->
    <!-- ============================================================== -->
    <!-- Base estrela 5 pontas + Pistão a gás + Rodízios -->
    <g stroke="#0b0c10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <!-- Pistão central -->
      <rect x="242" y="388" width="28" height="58" rx="4" fill="#21222c"/>
      <rect x="246" y="410" width="20" height="36" fill="#14151c"/>
      <!-- Hachuras do pistão -->
      <line x1="246" y1="396" x2="262" y2="396" stroke="#6272a4" stroke-width="2"/>
      <line x1="246" y1="403" x2="258" y2="403" stroke="#6272a4" stroke-width="2"/>

      <!-- Pernas da base estrela em perspectiva -->
      <path d="M256 436 L142 462 L134 454 L244 426 Z" fill="#282a36"/>
      <path d="M256 436 L370 462 L378 454 L268 426 Z" fill="#282a36"/>
      <path d="M256 436 L192 472 L182 465 L248 430 Z" fill="#1e1f29"/>
      <path d="M256 436 L320 472 L330 465 L264 430 Z" fill="#1e1f29"/>
      <!-- Detalhe neon nas hastes da base -->
      <line x1="238" y1="434" x2="152" y2="454" stroke="#bd93f9" stroke-width="2.2"/>
      <line x1="274" y1="434" x2="360" y2="454" stroke="#bd93f9" stroke-width="2.2"/>

      <!-- Rodinhas duplas detalhadas -->
      <circle cx="138" cy="468" r="13" fill="#14151c"/>
      <circle cx="138" cy="468" r="6" fill="#bd93f9"/>
      <circle cx="187" cy="477" r="13" fill="#14151c"/>
      <circle cx="187" cy="477" r="6" fill="#8be9fd"/>
      <circle cx="325" cy="477" r="13" fill="#14151c"/>
      <circle cx="325" cy="477" r="6" fill="#8be9fd"/>
      <circle cx="374" cy="468" r="13" fill="#14151c"/>
      <circle cx="374" cy="468" r="6" fill="#bd93f9"/>
    </g>

    <!-- Encosto Alto Racing da Cadeira Gamer (Perspectiva 3/4 Traseira/Lateral) -->
    <g stroke="#0b0c10" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round">
      <!-- Abas laterais (wings) do encosto -->
      <path d="M168 62 L212 42 L300 42 L344 62 L364 138 L342 332 L170 332 L148 138 Z" fill="url(#chairLeather)"/>
      <!-- Friso neon racing no contorno interno do encosto -->
      <path d="M180 70 L216 52 L296 52 L332 70 L348 140 L328 320 L184 320 L164 140 Z" fill="none" stroke="#ff79c6" stroke-width="3"/>
      <!-- Painel central acolchoado com costura diamante (Matelassê) -->
      <path d="M204 68 L308 68 L318 310 L194 310 Z" fill="#1e202b" stroke="#0b0c10" stroke-width="3"/>
    </g>

    <!-- Costuras Matelassê e Hachuras de Couro no Encosto -->
    <g stroke="#44475a" stroke-width="1.6" opacity="0.85">
      <line x1="204" y1="105" x2="308" y2="105"/>
      <line x1="201" y1="145" x2="311" y2="145"/>
      <line x1="198" y1="185" x2="314" y2="185"/>
      <line x1="210" y1="68" x2="295" y2="185"/>
      <line x1="295" y1="68" x2="210" y2="185"/>
      <!-- Passadores de cinto do encosto gamer -->
      <rect x="214" y="80" width="26" height="14" rx="5" fill="#0f1016" stroke="#8be9fd" stroke-width="2"/>
      <rect x="272" y="80" width="26" height="14" rx="5" fill="#0f1016" stroke="#8be9fd" stroke-width="2"/>
    </g>

    <!-- Braços 4D da Cadeira Gamer (Esquerdo e Direito) -->
    <g stroke="#0b0c10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <!-- Suporte vertical dos braços -->
      <path d="M142 260 L142 356 L166 364 L166 260 Z" fill="#181922"/>
      <path d="M370 260 L370 356 L346 364 L346 260 Z" fill="#181922"/>
      <!-- Apoios de braço acolchoados -->
      <rect x="118" y="244" width="60" height="22" rx="8" fill="#2c2e3e"/>
      <line x1="126" y1="252" x2="170" y2="252" stroke="#8be9fd" stroke-width="2.2"/>
      <rect x="334" y="244" width="60" height="22" rx="8" fill="#2c2e3e"/>
      <line x1="342" y1="252" x2="386" y2="252" stroke="#8be9fd" stroke-width="2.2"/>
    </g>

    <!-- Assento da Cadeira Gamer (Onde os pés/canelas estão apoiados) -->
    <g stroke="#0b0c10" stroke-width="4.2" stroke-linejoin="round">
      <path d="M138 342 L374 342 L392 384 L120 384 Z" fill="#252736"/>
      <path d="M130 374 L382 374" stroke="#bd93f9" stroke-width="3"/>
      <!-- Hachuras de sombra no assento -->
      <line x1="148" y1="354" x2="180" y2="354" stroke="#111218" stroke-width="2.5"/>
      <line x1="330" y1="354" x2="365" y2="354" stroke="#111218" stroke-width="2.5"/>
    </g>

    <!-- ============================================================== -->
    <!-- 2. PERSONAGEM (TRAÇO REALISTA INKED / QUADRINHOS DETALHADO)    -->
    <!-- ============================================================== -->

    <!-- Cabelo + Cabeça virada por cima do ombro + Headset Gamer -->
    <g stroke="#0b0c10" stroke-linecap="round" stroke-linejoin="round">
      <!-- Pescoço e nuca com linha anatômica -->
      <path d="M236 108 L234 134 L278 134 L274 108 Z" fill="url(#skinTone)" stroke-width="3.8"/>
      <path d="M248 116 L246 130" stroke="#8c533e" stroke-width="2"/>
      <path d="M264 116 L266 130" stroke="#8c533e" stroke-width="2"/>

      <!-- Cabeça levemente virada olhando para trás (3/4 perfil) -->
      <path d="M226 60 C220 78, 222 104, 238 115 C254 123, 276 118, 286 102 C294 86, 290 62, 274 52 C256 42, 234 46, 226 60 Z" fill="url(#skinTone)" stroke-width="4"/>

      <!-- Expressão facial de perfil 3/4 (olho piscando/provocando + sobrancelha + sorriso) -->
      <path d="M266 76 L280 73" stroke="#0b0c10" stroke-width="3.2"/>
      <path d="M268 83 Q275 80 281 83" fill="none" stroke="#0b0c10" stroke-width="2.8"/>
      <path d="M282 86 L288 94 L280 96" fill="none" stroke="#8c533e" stroke-width="2.4"/>
      <path d="M264 102 Q275 108 282 100" fill="none" stroke="#0b0c10" stroke-width="3"/>
      <!-- Traços de maçã do rosto / queixo -->
      <path d="M258 92 L264 96" stroke="#b57459" stroke-width="2"/>

      <!-- Cabelo masculino estilizado com mechas traçadas -->
      <path d="M220 74 C214 54, 228 34, 254 32 C278 30, 298 44, 294 64 C284 54, 272 52, 258 56 C244 60, 232 68, 220 74 Z" fill="#181524" stroke-width="3.8"/>
      <path d="M232 46 Q252 38 274 44" fill="none" stroke="#6272a4" stroke-width="2"/>
      <path d="M224 58 Q242 48 262 50" fill="none" stroke="#bd93f9" stroke-width="1.8"/>

      <!-- Headset Gamer Pro com arco e microfone -->
      <path d="M222 72 C218 40, 284 36, 286 68" fill="none" stroke="#282a36" stroke-width="7"/>
      <path d="M222 72 C218 40, 284 36, 286 68" fill="none" stroke="#8be9fd" stroke-width="2.5"/>
      <!-- Concha do Headset na orelha esquerda -->
      <ellipse cx="230" cy="82" rx="12" ry="16" transform="rotate(-12 230 82)" fill="#1e1f29" stroke="#0b0c10" stroke-width="3.8"/>
      <ellipse cx="230" cy="82" rx="6" ry="10" transform="rotate(-12 230 82)" fill="none" stroke="#ff79c6" stroke-width="2.4"/>
    </g>

    <!-- ============================================================== -->
    <!-- 3. TRONCO / MOLETOM GAMER INCLINADO SEGURANDO NA CADEIRA       -->
    <!-- ============================================================== -->
    <g stroke="#0b0c10" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- Braço Esquerdo e Mão segurando a borda da cadeira -->
      <path d="M198 136 C172 148, 154 172, 152 198 L176 202 C182 182, 194 168, 208 158 Z" fill="url(#hoodieTone)"/>
      <!-- Mão esquerda segurando a aba da cadeira -->
      <path d="M146 194 C140 198, 140 210, 150 214 C160 216, 170 210, 172 200 Z" fill="url(#skinTone)" stroke-width="3.5"/>
      <line x1="146" y1="202" x2="158" y2="204" stroke="#8c533e" stroke-width="2"/>
      <line x1="147" y1="208" x2="160" y2="209" stroke="#8c533e" stroke-width="2"/>

      <!-- Braço Direito e Mão segurando a borda direita da cadeira -->
      <path d="M314 136 C340 148, 358 172, 360 198 L336 202 C330 182, 318 168, 304 158 Z" fill="url(#hoodieTone)"/>
      <!-- Mão direita segurando a aba da cadeira -->
      <path d="M366 194 C372 198, 372 210, 362 214 C352 216, 342 210, 340 200 Z" fill="url(#skinTone)" stroke-width="3.5"/>
      <line x1="366" y1="202" x2="354" y2="204" stroke="#8c533e" stroke-width="2"/>
      <line x1="365" y1="208" x2="352" y2="209" stroke="#8c533e" stroke-width="2"/>

      <!-- Costas do Moletom / Jaqueta levantada até a lombar -->
      <path d="M194 132 C222 122, 290 122, 318 132 L308 214 C276 204, 236 204, 204 214 Z" fill="url(#hoodieTone)"/>
      <!-- Capuz caído nas costas com dobras detalhadas -->
      <path d="M214 128 C236 162, 276 162, 298 128 C278 136, 234 136, 214 128 Z" fill="#2b2445" stroke-width="3.6"/>
      <!-- Dobras de tecido e hachuras nas costas da camisa -->
      <path d="M216 174 Q256 166 294 176" fill="none" stroke="#120f1d" stroke-width="3"/>
      <path d="M210 192 Q256 182 300 194" fill="none" stroke="#bd93f9" stroke-width="2" opacity="0.7"/>
      <line x1="226" y1="158" x2="242" y2="170" stroke="#120f1d" stroke-width="2.2"/>
      <line x1="286" y1="158" x2="268" y2="170" stroke="#120f1d" stroke-width="2.2"/>
      <!-- Barra elástica da blusa levantada -->
      <path d="M202 204 C236 194, 276 194, 310 204 L308 218 C276 208, 236 208, 204 218 Z" fill="#292342" stroke-width="3.6"/>
    </g>

    <!-- ============================================================== -->
    <!-- 4. LOMBAR E GLÚTEOS (ANATOMIA TRAÇADA EM ESTILO COMIC/INK)     -->
    <!-- ============================================================== -->
    <g stroke="#0b0c10" stroke-linecap="round" stroke-linejoin="round">
      <!-- Parte inferior das costas (lombar) com covinhas anatômicas -->
      <path d="M210 212 C238 204, 274 204, 302 212 L310 236 L202 236 Z" fill="url(#skinTone)" stroke-width="3.8"/>
      <line x1="256" y1="208" x2="256" y2="226" stroke="#b57459" stroke-width="2.5"/>
      <circle cx="242" cy="224" r="2.2" fill="#9c5c44" stroke="none"/>
      <circle cx="270" cy="224" r="2.2" fill="#9c5c44" stroke="none"/>

      <!-- Glúteo Esquerdo (Volume realista + contorno em traço forte) -->
      <path d="M202 230 C180 242, 174 276, 190 302 C204 322, 244 322, 256 298 C258 272, 256 244, 256 232 C240 226, 216 226, 202 230 Z" fill="url(#skinTone)" stroke-width="4.5"/>

      <!-- Glúteo Direito (Volume realista + contorno em traço forte) -->
      <path d="M310 230 C332 242, 338 276, 322 302 C308 322, 268 322, 256 298 C256 272, 256 244, 256 232 C272 226, 296 226, 310 230 Z" fill="url(#skinTone)" stroke-width="4.5"/>

      <!-- Linha central pronunciada e dobras subglúteas (realismo comic) -->
      <path d="M256 228 C255 252, 257 282, 256 304" fill="none" stroke="#0b0c10" stroke-width="4.5"/>
      <path d="M192 298 C210 314, 238 314, 254 300" fill="none" stroke="#7a412d" stroke-width="3"/>
      <path d="M320 298 C302 314, 274 314, 258 300" fill="none" stroke="#7a412d" stroke-width="3"/>

      <!-- Hachuras artísticas (Crosshatching) de volume e sombra nos glúteos -->
      <g stroke="#a6634b" stroke-width="2" opacity="0.85">
        <!-- Sombra lateral esquerda -->
        <line x1="186" y1="262" x2="200" y2="268"/>
        <line x1="185" y1="272" x2="202" y2="278"/>
        <line x1="188" y1="282" x2="206" y2="288"/>
        <line x1="194" y1="292" x2="214" y2="296"/>
        <!-- Sombra lateral direita -->
        <line x1="326" y1="262" x2="312" y2="268"/>
        <line x1="327" y1="272" x2="310" y2="278"/>
        <line x1="324" y1="282" x2="306" y2="288"/>
        <line x1="318" y1="292" x2="298" y2="296"/>
        <!-- Sombra junto à linha central -->
        <line x1="256" y1="250" x2="246" y2="256"/>
        <line x1="256" y1="260" x2="244" y2="266"/>
        <line x1="256" y1="270" x2="246" y2="276"/>
        <line x1="256" y1="255" x2="266" y2="261"/>
        <line x1="256" y1="265" x2="268" y2="271"/>
      </g>

      <!-- Brilho especular / Rim light estilo ilustração digital -->
      <path d="M206 244 C198 256, 198 274, 206 286" fill="none" stroke="#fff5ed" stroke-width="3.2" opacity="0.75"/>
      <path d="M298 244 C308 256, 308 274, 298 286" fill="none" stroke="#fff5ed" stroke-width="3.2" opacity="0.75"/>
    </g>

    <!-- ============================================================== -->
    <!-- 5. COXAS + CALÇA JEANS ARRIADA NOS JOELHOS COM DOBRAS E CINTO  -->
    <!-- ============================================================== -->
    <g stroke="#0b0c10" stroke-linecap="round" stroke-linejoin="round">
      <!-- Topo das coxas logo abaixo dos glúteos -->
      <path d="M196 304 L192 332 L246 332 L250 304 Z" fill="url(#skinTone)" stroke-width="4"/>
      <path d="M316 304 L320 332 L266 332 L262 304 Z" fill="url(#skinTone)" stroke-width="4"/>
      <!-- Hachuras nas coxas -->
      <line x1="200" y1="316" x2="214" y2="320" stroke="#9c5c44" stroke-width="2"/>
      <line x1="312" y1="316" x2="298" y2="320" stroke="#9c5c44" stroke-width="2"/>

      <!-- Elástico da cueca boxer aparecendo por dentro da calça arriada -->
      <path d="M188 318 C224 328, 288 328, 324 318 L326 330 C288 340, 224 340, 186 330 Z" fill="#ff5555" stroke-width="3.6"/>
      <line x1="204" y1="325" x2="308" y2="325" stroke="#f8f8f2" stroke-width="1.8" stroke-dasharray="6 6"/>

      <!-- Calça Jeans Arriada e Sanfonada nos Joelhos/Canelas -->
      <path d="M178 326 C218 338, 294 338, 334 326 C344 338, 342 356, 332 368 L272 368 L256 352 L240 368 L180 368 C170 356, 168 338, 178 326 Z" fill="url(#denimTone)" stroke-width="4.2"/>

      <!-- Cinto de couro preto com fivela prateada passado no cós da calça arriada -->
      <path d="M180 330 C220 342, 292 342, 332 330 L334 340 C292 352, 220 352, 178 340 Z" fill="#14151c" stroke-width="3.5"/>
      <rect x="244" y="333" width="24" height="14" rx="3" fill="#8be9fd" stroke="#0b0c10" stroke-width="3"/>

      <!-- Dobras realistas de tecido (sanfonado) e bolsos traseiros do jeans -->
      <path d="M192 348 L226 352 L222 364 L194 362 Z" fill="#1d2b42" stroke="#0b0c10" stroke-width="2.6"/>
      <path d="M320 348 L286 352 L290 364 L318 362 Z" fill="#1d2b42" stroke="#0b0c10" stroke-width="2.6"/>
      <path d="M184 354 Q220 364 248 352" fill="none" stroke="#8be9fd" stroke-width="1.8" opacity="0.6"/>
      <path d="M328 354 Q292 364 264 352" fill="none" stroke="#8be9fd" stroke-width="1.8" opacity="0.6"/>

      <!-- Tênis / Pés apoiados em cima do assento da cadeira gamer -->
      <path d="M174 366 L232 366 L236 382 L166 382 C164 374, 168 368, 174 366 Z" fill="#1e1f29" stroke-width="3.8"/>
      <line x1="168" y1="379" x2="234" y2="379" stroke="#50fa7b" stroke-width="3"/>
      <path d="M280 366 L338 366 C344 368, 348 374, 346 382 L276 382 Z" fill="#1e1f29" stroke-width="3.8"/>
      <line x1="278" y1="379" x2="344" y2="379" stroke="#50fa7b" stroke-width="3"/>
    </g>

    <!-- ============================================================== -->
    <!-- 6. LINHAS DE IMPACTO / COMIC FX NEON DRACULA                   -->
    <!-- ============================================================== -->
    <g stroke="#ff79c6" stroke-width="3.2" stroke-linecap="round">
      <line x1="142" y1="268" x2="162" y2="272"/>
      <line x1="136" y1="286" x2="160" y2="286"/>
      <line x1="144" y1="304" x2="166" y2="298"/>

      <line x1="370" y1="268" x2="350" y2="272"/>
      <line x1="376" y1="286" x2="352" y2="286"/>
      <line x1="368" y1="304" x2="346" y2="298"/>
    </g>
  </g>
</svg>
